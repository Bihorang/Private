<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>우리의 여름, 해운대</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Nanum+Pen+Script&display=swap');
  :root {
    color-scheme: dark;
  }
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #111319;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                 "Noto Sans KR", sans-serif;
  }
  .wrap {
    width: min(96vw, 1100px);
    padding: 20px;
  }
  .toolbar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  button {
    border: 0;
    border-radius: 12px;
    padding: 11px 16px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  .primary {
    background: #ffffff;
    color: #111;
  }
  .secondary {
    background: #2a2f3a;
    color: #fff;
  }
  .canvas-box {
    overflow: hidden;
    border-radius: 18px;
    box-shadow: 0 18px 60px rgba(0,0,0,.45);
    background: #000;
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
  }
  .note {
    margin-top: 12px;
    font-size: 13px;
    line-height: 1.55;
    color: #c9ced8;
  }
</style>
</head>

    </p>
  </main>

let showOverlay = true;

function strokeTextWithShadow(text, x, y, font, align = "center") {
  ctx.save();
  ctx.textAlign = align;
  ctx.textBaseline = "middle";
  ctx.font = font;
  ctx.lineJoin = "round";
  ctx.lineWidth = 12;
  ctx.strokeStyle = "rgba(0,0,0,0.48)";
  ctx.strokeText(text, x, y);
  ctx.fillStyle = "#fffdf8";
  ctx.fillText(text, x, y);
  ctx.restore();
}

function drawSparkle(x, y, size, color = "#ffffff") {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = Math.max(3, size * 0.10);
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(x, y - size);
  ctx.lineTo(x, y + size);
  ctx.moveTo(x - size, y);
  ctx.lineTo(x + size, y);
  ctx.stroke();
  ctx.restore();
}

function drawHeart(x, y, size, color = "#ff8db7") {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = Math.max(4, size * 0.12);
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.beginPath();
  ctx.moveTo(x, y + size * 0.8);
  ctx.bezierCurveTo(
    x - size * 1.2, y + size * 0.1,
    x - size * 0.9, y - size * 0.9,
    x, y - size * 0.15
  );
  ctx.bezierCurveTo(
    x + size * 0.9, y - size * 0.9,
    x + size * 1.2, y + size * 0.1,
    x, y + size * 0.8
  );
  ctx.stroke();
  ctx.restore();
}

function drawCloud(x, y, scale = 1) {
  ctx.save();
  ctx.strokeStyle = "#b7ddff";
  ctx.lineWidth = 7 * scale;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.beginPath();
  ctx.moveTo(x - 88 * scale, y + 18 * scale);
  ctx.bezierCurveTo(
    x - 100 * scale, y - 22 * scale,
    x - 55 * scale, y - 42 * scale,
    x - 26 * scale, y - 18 * scale
  );
  ctx.bezierCurveTo(
    x - 8 * scale, y - 62 * scale,
    x + 58 * scale, y - 58 * scale,
    x + 66 * scale, y - 14 * scale
  );
  ctx.bezierCurveTo(
    x + 112 * scale, y - 10 * scale,
    x + 118 * scale, y + 36 * scale,
    x + 76 * scale, y + 42 * scale
  );
  ctx.lineTo(x - 52 * scale, y + 42 * scale);
  ctx.bezierCurveTo(
    x - 74 * scale, y + 42 * scale,
    x - 89 * scale, y + 32 * scale,
    x - 88 * scale, y + 18 * scale
  );
  ctx.stroke();
  ctx.restore();
}

function drawWave(x, y, scale = 1) {
  ctx.save();
  ctx.strokeStyle = "#65c8ff";
  ctx.lineWidth = 8 * scale;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.bezierCurveTo(
    x + 42 * scale, y - 34 * scale,
    x + 90 * scale, y + 34 * scale,
    x + 132 * scale, y
  );
  ctx.bezierCurveTo(
    x + 174 * scale, y - 34 * scale,
    x + 222 * scale, y + 34 * scale,
    x + 264 * scale, y
  );
  ctx.stroke();
  ctx.restore();
}

  ctx.moveTo(1010, 245);
  ctx.bezierCurveTo(1220, 270, 1510, 250, 1785, 260);
  ctx.stroke();
  ctx.restore();

  // 서브 문구
  ctx.save();
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = '700 60px "Gaegu", "Nanum Pen Script", cursive';
  ctx.lineJoin = "round";
  ctx.lineWidth = 8;
  ctx.strokeStyle = "rgba(0,0,0,.42)";
  ctx.strokeText("2026 Summer", 1410, 320);
  ctx.fillStyle = "#ffd866";
  ctx.fillText("2026 Summer", 1410, 320);
  ctx.restore();

  // 주변 낙서 — 얼굴과 인물 영역을 피해서 가장자리 위주
  drawCloud(170, 245, 1.05);
  drawCloud(1850, 220, 0.85);
  drawHeart(1880, 435, 34);
  drawHeart(930, 350, 24, "#ff9fcb");
  drawSparkle(1800, 370, 30, "#ffe57a");
  drawSparkle(198, 420, 26, "#ffffff");
  drawSparkle(970, 95, 22, "#ffffff");
  drawWave(90, 555, 0.78);
  drawWave(1655, 540, 0.62);

  // 작은 별
  ctx.save();
  ctx.strokeStyle = "#ffe57a";
  ctx.lineWidth = 7;
  ctx.lineJoin = "round";
  ctx.beginPath();
  ctx.moveTo(260, 120);
  ctx.lineTo(274, 158);
  ctx.lineTo(315, 158);
  ctx.lineTo(282, 182);
  ctx.lineTo(295, 222);
  ctx.lineTo(260, 198);
  ctx.lineTo(226, 222);
  ctx.lineTo(239, 182);
  ctx.lineTo(206, 158);
  ctx.lineTo(247, 158);
  ctx.closePath();
  ctx.stroke();
  ctx.restore();
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(photo, 0, 0, canvas.width, canvas.height);
  if (showOverlay) drawOverlay();
}

photo.onload = render;
document.fonts.ready.then(render);

overlayBtn.addEventListener("click", () => {
  showOverlay = !showOverlay;
  render();
});

downloadBtn.addEventListener("click", () => {
  render();
  const link = document.createElement("a");
  link.download = "우리의_여름_해운대_2026.png";
  link.href = canvas.toDataURL("image/png");
  link.click();
});
</script>
</body>
</html>
